globals:
  - id: dp114_request_in_progress
    type: int
    restore_value: false
    initial_value: '-1'

script:
  - id: !extend tuya_ready
    then:
      - button.press: refresh_solar_configuration
      - button.press: refresh_ct_detection

  - id: request_tuya_meter_configuration
    mode: queued
    parameters:
      command: int
    then:
      - lambda: |-
          if (command < 0 || command > 1) {
            ESP_LOGE("tuya", "Unsupported DP 114 command: %d", command);
            id(dp114_request_in_progress) = -1;
            return;
          }
          id(dp114_request_in_progress) = command;
          const uint8_t expected_dp = command == 0 ? 109 : 113;
          ESP_LOGI("tuya", "Sending DP 114 command %d; waiting for DP %u", command, expected_dp);
          id(my_meter).force_set_enum_datapoint_value(114, command);
      - wait_until:
          condition:
            lambda: return id(dp114_request_in_progress) == -1;
          timeout: 2s
      - lambda: |-
          if (id(dp114_request_in_progress) == command) {
            const uint8_t expected_dp = command == 0 ? 109 : 113;
            ESP_LOGW("tuya", "DP 114 command %d timed out waiting for DP %u", command, expected_dp);
            id(dp114_request_in_progress) = -1;
          }

uart:
  id: tuya_uart
  rx_pin: P10
  tx_pin: P11
  baud_rate: 115200
  # LibreTiny's compile-time ring remains 256 bytes while monitoring overflow.
  rx_buffer_size: 256

tuya:
  id: my_meter
  uart_id: tuya_uart
  time_id: ha_time
  on_datapoint_update:
    # Phase A raw -> publish
    - sensor_datapoint: 101
      datapoint_type: raw
      then:
        - lambda: |-
            if (x.size() != 13) {
              ESP_LOGW("tuya", "Phase A Data (DP 101) has invalid length %zu; expected 13", x.size());
              return;
            }
            auto read_u32_le = [&x](size_t offset) -> uint32_t {
              return static_cast<uint32_t>(x[offset])
                | (static_cast<uint32_t>(x[offset + 1]) << 8)
                | (static_cast<uint32_t>(x[offset + 2]) << 16)
                | (static_cast<uint32_t>(x[offset + 3]) << 24);
            };
            id(phase_a_voltage).publish_state(read_u32_le(0) * ${voltage_scale});
            id(phase_a_current).publish_state(static_cast<int32_t>(read_u32_le(4)) * ${current_scale});
            id(phase_a_power).publish_state(static_cast<int32_t>(read_u32_le(8)) * ${power_scale});

    # Phase B raw -> publish
    - sensor_datapoint: 102
      datapoint_type: raw
      then:
        - lambda: |-
            if (x.size() != 13) {
              ESP_LOGW("tuya", "Phase B Data (DP 102) has invalid length %zu; expected 13", x.size());
              return;
            }
            auto read_u32_le = [&x](size_t offset) -> uint32_t {
              return static_cast<uint32_t>(x[offset])
                | (static_cast<uint32_t>(x[offset + 1]) << 8)
                | (static_cast<uint32_t>(x[offset + 2]) << 16)
                | (static_cast<uint32_t>(x[offset + 3]) << 24);
            };
            id(phase_b_voltage).publish_state(read_u32_le(0) * ${voltage_scale});
            id(phase_b_current).publish_state(static_cast<int32_t>(read_u32_le(4)) * ${current_scale});
            id(phase_b_power).publish_state(static_cast<int32_t>(read_u32_le(8)) * ${power_scale});

    # Phase C raw -> publish
    - sensor_datapoint: 103
      datapoint_type: raw
      then:
        - lambda: |-
            if (x.size() != 13) {
              ESP_LOGW("tuya", "Phase C Data (DP 103) has invalid length %zu; expected 13", x.size());
              return;
            }
            auto read_u32_le = [&x](size_t offset) -> uint32_t {
              return static_cast<uint32_t>(x[offset])
                | (static_cast<uint32_t>(x[offset + 1]) << 8)
                | (static_cast<uint32_t>(x[offset + 2]) << 16)
                | (static_cast<uint32_t>(x[offset + 3]) << 24);
            };
            id(phase_c_voltage).publish_state(read_u32_le(0) * ${voltage_scale});
            id(phase_c_current).publish_state(static_cast<int32_t>(read_u32_le(4)) * ${current_scale});
            id(phase_c_power).publish_state(static_cast<int32_t>(read_u32_le(8)) * ${power_scale});

    # Total raw -> publish
    - sensor_datapoint: 104
      datapoint_type: raw
      then:
        - lambda: |-
            if (x.size() != 9) {
              ESP_LOGW("tuya", "Total Data (DP 104) has invalid length %zu; expected 9", x.size());
              return;
            }
            auto read_u32_le = [&x](size_t offset) -> uint32_t {
              return static_cast<uint32_t>(x[offset])
                | (static_cast<uint32_t>(x[offset + 1]) << 8)
                | (static_cast<uint32_t>(x[offset + 2]) << 16)
                | (static_cast<uint32_t>(x[offset + 3]) << 24);
            };
            id(total_current).publish_state(static_cast<int32_t>(read_u32_le(0)) * ${current_scale});
            id(total_power).publish_state(static_cast<int32_t>(read_u32_le(4)) * ${power_scale});
            id(grid_frequency).publish_state(x[8] * ${freq_scale});

    # Sub-circuit Power
    - sensor_datapoint: 105
      datapoint_type: raw
      then:
        - lambda: |-
            if (x.empty()) {
              ESP_LOGW("tuya", "Sub-circuit Power (DP 105) is empty");
              return;
            }
            const size_t count = x[0];
            const size_t expected_size = 1 + count * 5;
            if (count > 16 || x.size() != expected_size) {
              ESP_LOGW("tuya", "Sub-circuit Power (DP 105) has invalid count/length: count=%zu, length=%zu, expected=%zu", count, x.size(), expected_size);
              return;
            }
            for (size_t i = 0; i < count; i++) {
              const size_t offset = 1 + i * 5;
              const uint8_t circuit_id = x[offset];
              const uint32_t raw_value = static_cast<uint32_t>(x[offset + 1])
                | (static_cast<uint32_t>(x[offset + 2]) << 8)
                | (static_cast<uint32_t>(x[offset + 3]) << 16)
                | (static_cast<uint32_t>(x[offset + 4]) << 24);
              const float value = static_cast<int32_t>(raw_value) * ${power_scale};
              switch (circuit_id) {
                case 1:  id(circuit_1_power).publish_state(value); break;
                case 2:  id(circuit_2_power).publish_state(value); break;
                case 3:  id(circuit_3_power).publish_state(value); break;
                case 4:  id(circuit_4_power).publish_state(value); break;
                case 5:  id(circuit_5_power).publish_state(value); break;
                case 6:  id(circuit_6_power).publish_state(value); break;
                case 7:  id(circuit_7_power).publish_state(value); break;
                case 8:  id(circuit_8_power).publish_state(value); break;
                case 9:  id(circuit_9_power).publish_state(value); break;
                case 10: id(circuit_10_power).publish_state(value); break;
                case 11: id(circuit_11_power).publish_state(value); break;
                case 12: id(circuit_12_power).publish_state(value); break;
                case 13: id(circuit_13_power).publish_state(value); break;
                case 14: id(circuit_14_power).publish_state(value); break;
                case 15: id(circuit_15_power).publish_state(value); break;
                case 16: id(circuit_16_power).publish_state(value); break;
                default:
                  ESP_LOGW("tuya", "Sub-circuit Power (DP 105) reported invalid circuit ID %u", circuit_id);
                  break;
              }
            }

    # Sub-circuit Current
    - sensor_datapoint: 106
      datapoint_type: raw
      then:
        - lambda: |-
            if (x.empty()) {
              ESP_LOGW("tuya", "Sub-circuit Current (DP 106) is empty");
              return;
            }
            const size_t count = x[0];
            const size_t expected_size = 1 + count * 5;
            if (count > 16 || x.size() != expected_size) {
              ESP_LOGW("tuya", "Sub-circuit Current (DP 106) has invalid count/length: count=%zu, length=%zu, expected=%zu", count, x.size(), expected_size);
              return;
            }
            for (size_t i = 0; i < count; i++) {
              const size_t offset = 1 + i * 5;
              const uint8_t circuit_id = x[offset];
              const uint32_t raw_value = static_cast<uint32_t>(x[offset + 1])
                | (static_cast<uint32_t>(x[offset + 2]) << 8)
                | (static_cast<uint32_t>(x[offset + 3]) << 16)
                | (static_cast<uint32_t>(x[offset + 4]) << 24);
              const float value = raw_value * ${current_scale};
              switch (circuit_id) {
                case 1:  id(circuit_1_current).publish_state(value); break;
                case 2:  id(circuit_2_current).publish_state(value); break;
                case 3:  id(circuit_3_current).publish_state(value); break;
                case 4:  id(circuit_4_current).publish_state(value); break;
                case 5:  id(circuit_5_current).publish_state(value); break;
                case 6:  id(circuit_6_current).publish_state(value); break;
                case 7:  id(circuit_7_current).publish_state(value); break;
                case 8:  id(circuit_8_current).publish_state(value); break;
                case 9:  id(circuit_9_current).publish_state(value); break;
                case 10: id(circuit_10_current).publish_state(value); break;
                case 11: id(circuit_11_current).publish_state(value); break;
                case 12: id(circuit_12_current).publish_state(value); break;
                case 13: id(circuit_13_current).publish_state(value); break;
                case 14: id(circuit_14_current).publish_state(value); break;
                case 15: id(circuit_15_current).publish_state(value); break;
                case 16: id(circuit_16_current).publish_state(value); break;
                default:
                  ESP_LOGW("tuya", "Sub-circuit Current (DP 106) reported invalid circuit ID %u", circuit_id);
                  break;
              }
            }

    # Per-circuit phase assignment
    - sensor_datapoint: 107
      datapoint_type: raw
      then:
        - lambda: |-
            if (x.empty()) {
              ESP_LOGW("tuya", "Circuit Phase Assignments (DP 107) is empty");
              return;
            }
            const size_t count = x[0];
            const size_t expected_size = 1 + count * 2;
            if (count > 16 || x.size() != expected_size) {
              ESP_LOGW("tuya", "Circuit Phase Assignments (DP 107) has invalid count/length: count=%zu, length=%zu, expected=%zu", count, x.size(), expected_size);
              return;
            }
            std::string summary;
            for (size_t i = 0; i < count; i++) {
              const uint8_t circuit_id = x[1 + i * 2];
              const uint8_t phase_id = x[2 + i * 2];
              if (circuit_id < 1 || circuit_id > 16) {
                ESP_LOGW("tuya", "Circuit Phase Assignments (DP 107) reported invalid circuit ID %u", circuit_id);
                continue;
              }
              const char *phase;
              switch (phase_id) {
                case 0: phase = "Auto"; break;
                case 1: phase = "A"; break;
                case 2: phase = "B"; break;
                case 3: phase = "C"; break;
                default: phase = "Unknown"; break;
              }
              if (!summary.empty()) {
                summary += ", ";
              }
              summary += str_sprintf("C%02u=%s", circuit_id, phase);
              if (phase_id > 3) {
                summary += str_sprintf("(%u)", phase_id);
              }
            }
            if (summary.empty()) {
              summary = "None";
            }
            ESP_LOGI("tuya", "Circuit Phase Assignments (DP 107): %s", summary.c_str());

    # Meter Type (text_sensor)
    - sensor_datapoint: 108
      datapoint_type: enum
      then:
        - lambda: |-
            switch (x) { // 0=unknow,1=3_phase,2=1_phase,3=1_phase_3_wire,4=other
              case 1: id(meter_type).publish_state("3 phase"); break;
              case 2: id(meter_type).publish_state("1 phase"); break;
              case 3: id(meter_type).publish_state("1 phase / 3 wire"); break;
              case 4: id(meter_type).publish_state("Other"); break;
              default: id(meter_type).publish_state("Unknown"); break;
            }

    # Per-circuit solar configuration
    - sensor_datapoint: 109
      datapoint_type: raw
      then:
        - lambda: |-
            if (x.empty()) {
              ESP_LOGW("tuya", "Solar Circuits (DP 109) is empty");
              return;
            }
            const size_t count = x[0];
            const size_t expected_size = 1 + count * 2;
            if (count > 16 || x.size() != expected_size) {
              ESP_LOGW("tuya", "Solar Circuits (DP 109) has invalid count/length: count=%zu, length=%zu, expected=%zu", count, x.size(), expected_size);
              return;
            }
            std::string summary;
            for (size_t i = 0; i < count; i++) {
              const uint8_t circuit_id = x[1 + i * 2];
              const uint8_t solar_flag = x[2 + i * 2];
              if (circuit_id < 1 || circuit_id > 16) {
                ESP_LOGW("tuya", "Solar Circuits (DP 109) reported invalid circuit ID %u", circuit_id);
                continue;
              }
              if (solar_flag > 1) {
                ESP_LOGW("tuya", "Solar Circuits (DP 109) reported unknown flag %u for circuit %u", solar_flag, circuit_id);
                continue;
              }
              const bool enabled = solar_flag == 1;
              switch (circuit_id) {
                case 1:  id(circuit_1_solar_configured).publish_state(enabled); break;
                case 2:  id(circuit_2_solar_configured).publish_state(enabled); break;
                case 3:  id(circuit_3_solar_configured).publish_state(enabled); break;
                case 4:  id(circuit_4_solar_configured).publish_state(enabled); break;
                case 5:  id(circuit_5_solar_configured).publish_state(enabled); break;
                case 6:  id(circuit_6_solar_configured).publish_state(enabled); break;
                case 7:  id(circuit_7_solar_configured).publish_state(enabled); break;
                case 8:  id(circuit_8_solar_configured).publish_state(enabled); break;
                case 9:  id(circuit_9_solar_configured).publish_state(enabled); break;
                case 10: id(circuit_10_solar_configured).publish_state(enabled); break;
                case 11: id(circuit_11_solar_configured).publish_state(enabled); break;
                case 12: id(circuit_12_solar_configured).publish_state(enabled); break;
                case 13: id(circuit_13_solar_configured).publish_state(enabled); break;
                case 14: id(circuit_14_solar_configured).publish_state(enabled); break;
                case 15: id(circuit_15_solar_configured).publish_state(enabled); break;
                case 16: id(circuit_16_solar_configured).publish_state(enabled); break;
              }
              if (enabled) {
                if (!summary.empty()) {
                  summary += ", ";
                }
                summary += str_sprintf("C%02u", circuit_id);
              }
            }
            if (summary.empty()) {
              summary = "None";
            }
            ESP_LOGI("tuya", "Solar Circuits (DP 109): %s", summary.c_str());
            if (id(dp114_request_in_progress) == 0) {
              id(dp114_request_in_progress) = -1;
            }

    # Per-circuit voltage multiplier
    - sensor_datapoint: 111
      datapoint_type: raw
      then:
        - lambda: |-
            if (x.empty()) {
              ESP_LOGW("tuya", "Voltage Multipliers (DP 111) is empty");
              return;
            }
            const size_t count = x[0];
            const size_t expected_size = 1 + count * 2;
            if (count > 16 || x.size() != expected_size) {
              ESP_LOGW("tuya", "Voltage Multipliers (DP 111) has invalid count/length: count=%zu, length=%zu, expected=%zu", count, x.size(), expected_size);
              return;
            }
            std::string summary;
            for (size_t i = 0; i < count; i++) {
              const uint8_t circuit_id = x[1 + i * 2];
              const uint8_t multiplier = x[2 + i * 2];
              if (circuit_id < 1 || circuit_id > 16) {
                ESP_LOGW("tuya", "Voltage Multipliers (DP 111) reported invalid circuit ID %u", circuit_id);
                continue;
              }
              if (!summary.empty()) {
                summary += ", ";
              }
              summary += str_sprintf("C%02u=%u", circuit_id, multiplier);
            }
            if (summary.empty()) {
              summary = "None";
            }
            ESP_LOGI("tuya", "Voltage Multipliers (DP 111, raw values): %s", summary.c_str());

    # Global solar-accounting mode
    - sensor_datapoint: 112
      datapoint_type: enum
      then:
        - lambda: |-
            switch (x) {
              case 1: id(solar_accounting).publish_state("Disabled"); break;
              case 2: id(solar_accounting).publish_state("Enabled"); break;
              default:
                id(solar_accounting).publish_state("Unknown");
                ESP_LOGW("tuya", "Solar Accounting (DP 112) reported unknown value: %u", x);
                break;
            }

    # CT Insertion Detection
    - sensor_datapoint: 113
      datapoint_type: raw
      then:
        - lambda: |-
            if (x.size() != 4) {
              ESP_LOGW("tuya", "Detected CT Inputs (DP 113) has invalid length %zu; expected 4", x.size());
              return;
            }
            const uint32_t mask = static_cast<uint32_t>(x[0])
              | (static_cast<uint32_t>(x[1]) << 8)
              | (static_cast<uint32_t>(x[2]) << 16)
              | (static_cast<uint32_t>(x[3]) << 24);
            id(circuit_1_ct_detected).publish_state((mask & (1UL << 0)) != 0);
            id(circuit_2_ct_detected).publish_state((mask & (1UL << 1)) != 0);
            id(circuit_3_ct_detected).publish_state((mask & (1UL << 2)) != 0);
            id(circuit_4_ct_detected).publish_state((mask & (1UL << 3)) != 0);
            id(circuit_5_ct_detected).publish_state((mask & (1UL << 4)) != 0);
            id(circuit_6_ct_detected).publish_state((mask & (1UL << 5)) != 0);
            id(circuit_7_ct_detected).publish_state((mask & (1UL << 6)) != 0);
            id(circuit_8_ct_detected).publish_state((mask & (1UL << 7)) != 0);
            id(circuit_9_ct_detected).publish_state((mask & (1UL << 8)) != 0);
            id(circuit_10_ct_detected).publish_state((mask & (1UL << 9)) != 0);
            id(circuit_11_ct_detected).publish_state((mask & (1UL << 10)) != 0);
            id(circuit_12_ct_detected).publish_state((mask & (1UL << 11)) != 0);
            id(circuit_13_ct_detected).publish_state((mask & (1UL << 12)) != 0);
            id(circuit_14_ct_detected).publish_state((mask & (1UL << 13)) != 0);
            id(circuit_15_ct_detected).publish_state((mask & (1UL << 14)) != 0);
            id(circuit_16_ct_detected).publish_state((mask & (1UL << 15)) != 0);
            std::string summary;
            for (uint8_t circuit_id = 1; circuit_id <= 16; circuit_id++) {
              if ((mask & (1UL << (circuit_id - 1))) == 0) {
                continue;
              }
              if (!summary.empty()) {
                summary += ", ";
              }
              summary += str_sprintf("C%02u", circuit_id);
            }
            if (summary.empty()) {
              summary = "None";
            }
            ESP_LOGI("tuya", "Detected CT Inputs (DP 113, mask 0x%08" PRIX32 "): %s", mask, summary.c_str());
            if (id(dp114_request_in_progress) == 1) {
              id(dp114_request_in_progress) = -1;
            }

text_sensor:
  - platform: template
    name: Measurement Type
    id: meter_type
    internal: false
    icon: mdi:meter-electric

button:
  - platform: template
    name: Refresh Solar Configuration
    id: refresh_solar_configuration
    internal: ${sol_internal}
    entity_category: diagnostic
    icon: mdi:solar-power
    on_press:
      - script.execute:
          id: request_tuya_meter_configuration
          command: 0

  - platform: template
    name: Refresh CT Detection
    id: refresh_ct_detection
    entity_category: diagnostic
    icon: mdi:current-ac
    on_press:
      - script.execute:
          id: request_tuya_meter_configuration
          command: 1

sensor:
  # Temporary diagnostic: one event per incoming byte discarded by a full ring.
  - platform: bk72xx_uart_guard
    name: UART RX Overflows
    id: tuya_uart_rx_overflows
    uart_id: tuya_uart

  # Phase A
  - platform: template
    name: ${phA_name} Voltage
    id: phase_a_voltage
    internal: ${phA_internal}
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: ${phA_name} Current
    id: phase_a_current
    internal: ${phA_internal}
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 3

  - platform: template
    name: ${phA_name} Power
    id: phase_a_power
    internal: ${phA_internal}
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  - platform: template
    name: ${phA_name} Apparent Power
    id: phase_a_va
    internal: ${phA_internal}
    unit_of_measurement: VA
    device_class: apparent_power
    state_class: measurement
    accuracy_decimals: 0
    icon: mdi:sigma
    lambda: return id(phase_a_voltage).state * fabsf(id(phase_a_current).state);

  - platform: template
    name: ${phA_name} Power Factor
    id: phase_a_pf
    internal: ${phA_internal}
    unit_of_measurement: '%'
    device_class: power_factor
    state_class: measurement
    accuracy_decimals: 1
    lambda: |-
      const float V = id(phase_a_voltage).state;
      const float I = id(phase_a_current).state;
      const float P = id(phase_a_power).state; // W
      if (V <= 0 || I == 0) return NAN;
      float pf = fabsf(P) / (V * fabsf(I));
      if (pf > 1) pf = 1;
      return pf * 100.0f;
    filters:
      - round: 1

  # Phase B
  - platform: template
    name: ${phB_name} Voltage
    id: phase_b_voltage
    internal: ${phB_internal}
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: ${phB_name} Current
    id: phase_b_current
    internal: ${phB_internal}
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 3

  - platform: template
    name: ${phB_name} Power
    id: phase_b_power
    internal: ${phB_internal}
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  - platform: template
    name: ${phB_name} Apparent Power
    id: phase_b_va
    internal: ${phB_internal}
    unit_of_measurement: VA
    device_class: apparent_power
    state_class: measurement
    accuracy_decimals: 0
    icon: mdi:sigma
    lambda: return id(phase_b_voltage).state * fabsf(id(phase_b_current).state);

  - platform: template
    name: ${phB_name} Power Factor
    id: phase_b_pf
    internal: ${phB_internal}
    unit_of_measurement: '%'
    device_class: power_factor
    state_class: measurement
    accuracy_decimals: 1
    lambda: |-
      const float V = id(phase_b_voltage).state;
      const float I = id(phase_b_current).state;
      const float P = id(phase_b_power).state; // W
      if (V <= 0 || I == 0) return NAN;
      float pf = fabsf(P) / (V * fabsf(I));
      if (pf > 1) pf = 1;
      return pf * 100.0f;
    filters:
      - round: 1

  # Phase C
  - platform: template
    name: ${phC_name} Voltage
    id: phase_c_voltage
    internal: ${phC_internal}
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: ${phC_name} Current
    id: phase_c_current
    internal: ${phC_internal}
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 3

  - platform: template
    name: ${phC_name} Power
    id: phase_c_power
    internal: ${phC_internal}
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  - platform: template
    name: ${phC_name} Apparent Power
    id: phase_c_va
    internal: ${phC_internal}
    unit_of_measurement: VA
    device_class: apparent_power
    state_class: measurement
    accuracy_decimals: 0
    icon: mdi:sigma
    lambda: return id(phase_c_voltage).state * fabsf(id(phase_c_current).state);

  - platform: template
    name: ${phC_name} Power Factor
    id: phase_c_pf
    internal: ${phC_internal}
    unit_of_measurement: '%'
    device_class: power_factor
    state_class: measurement
    accuracy_decimals: 1
    lambda: |-
      const float V = id(phase_c_voltage).state;
      const float I = id(phase_c_current).state;
      const float P = id(phase_c_power).state; // W
      if (V <= 0 || I == 0) return NAN;
      float pf = fabsf(P) / (V * fabsf(I));
      if (pf > 1) pf = 1;
      return pf * 100.0f;
    filters:
      - round: 1

  # Totals
  - platform: template
    name: Total Current
    id: total_current
    internal: false
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 3

  - platform: template
    name: Total Power
    id: total_power
    internal: false
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  - platform: template
    name: Grid Frequency
    id: grid_frequency
    internal: false
    unit_of_measurement: Hz
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 0
    icon: mdi:cosine-wave

  - platform: template
    name: Total Apparent Power
    id: total_va
    internal: false
    unit_of_measurement: VA
    device_class: apparent_power
    state_class: measurement
    accuracy_decimals: 0
    icon: mdi:sigma
    lambda: |-
      return id(phase_a_voltage).state * fabsf(id(phase_a_current).state)
        + id(phase_b_voltage).state * fabsf(id(phase_b_current).state)
        + id(phase_c_voltage).state * fabsf(id(phase_c_current).state);

  - platform: template
    name: Total Power Factor
    id: total_pf
    internal: false
    unit_of_measurement: '%'
    device_class: power_factor
    state_class: measurement
    accuracy_decimals: 1
    lambda: |-
      const float S = id(phase_a_voltage).state * fabsf(id(phase_a_current).state)
        + id(phase_b_voltage).state * fabsf(id(phase_b_current).state)
        + id(phase_c_voltage).state * fabsf(id(phase_c_current).state);
      const float P = id(total_power).state; // W
      if (S <= 0) return NAN;
      float pf = fabsf(P) / S;
      if (pf > 1) pf = 1;
      return pf * 100.0f;
    filters:
      - round: 1

  # Totals from Tuya (DP 131, 132)
  - platform: tuya
    name: Total Consumed Energy
    internal: false
    sensor_datapoint: 131
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 2
    filters:
      - multiply: ${energy_scale}
      - clamp: { min_value: 0, max_value: 20000000 }

  - platform: tuya
    name: Total Generated Energy
    internal: ${sol_internal}
    sensor_datapoint: 132
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 2
    filters:
      - multiply: ${energy_scale}
      - clamp: { min_value: 0, max_value: 20000000 }

select:
  - platform: template
    name: Solar Accounting
    id: solar_accounting
    internal: ${sol_internal}
    entity_category: config
    icon: mdi:solar-power
    options:
      - Unknown
      - Disabled
      - Enabled
    initial_option: Unknown
    optimistic: false
    set_action:
      - lambda: |-
          if (x == "Disabled") {
            id(my_meter).set_enum_datapoint_value(112, 1);
          } else if (x == "Enabled") {
            id(my_meter).set_enum_datapoint_value(112, 2);
          } else {
            ESP_LOGW("tuya", "Solar Accounting 'Unknown' is read-only; no DP 112 value was written");
          }

substitutions:
  name: base-board-libretiny-beken
  friendly_name: Base Board LibreTiny (Beken)
  firmware_platform: bk72xx

packages:
  - !include base-board-libretiny.yaml

external_components:
  - source: !include ../../component-source.yaml
    components: [bk72xx_uart_guard, bk72xx_ota_packaging]
    refresh: 0s

# Keep ltchiptool's AES padding consistent on ARM and desktop build hosts.
bk72xx_ota_packaging:

# Remove after ESPHome's LibreTiny includes the interrupt-safe Serial read fix.
# Tracking: libretiny-eu/libretiny#154 and #432.
# The component emits no sources or linker flags without a merged uart: bus.
bk72xx_uart_guard:
